name: Release

# A v* tag publishes the GitHub Release and the Homebrew formula through the
# same locked GoReleaser image ci.yml builds snapshots with, then publishes the
# Docker image and the npm package from those exact binaries.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Fail before anything is published.
      - run: test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: make test

      - run: make release-tools

      - run: make release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # QEMU runs the arm64 image's package install on the amd64 runner.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Before npm, which cannot take a version back; a re-run pushes the same tags again.
      - run: make release-image-publish VERSION="${GITHUB_REF_NAME#v}"

      # npm trusted publishing (OIDC) needs npm 11.5.1+, which Node 22 does not ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: npm

      # Pre-release tags (v1.2.3-rc.1) publish under `next`, never `latest`. A
      # re-run skips a version that already reached the registry, so the smoke
      # job still runs.
      - run: |
          if [ -n "$(npm view "hookspot@${GITHUB_REF_NAME#v}" version 2>/dev/null)" ]; then
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*) npm_tag=next ;;
            *) npm_tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$npm_tag"
        working-directory: npm

  # The acceptance test: each channel installs on each platform and reports the
  # released version. A red matrix means yank; see docs/releases/RUNBOOK.md.
  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >>"$GITHUB_ENV"
        shell: bash

      - run: scripts/smoke.sh "$VERSION"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The registry can take a few minutes to serve a freshly published version.
      - run: |
          attempts=5
          for attempt in $(seq "$attempts"); do
            npm install -g "hookspot@$VERSION" && break
            [ "$attempt" -lt "$attempts" ] || exit 1
            sleep 30
          done
          scripts/smoke.sh "$VERSION" hookspot
        shell: bash

      - if: matrix.os == 'ubuntu-latest'
        run: scripts/smoke.sh "$VERSION" docker run --rm "hookspot/hookspot-cli:$VERSION"
        shell: bash

      # Pre-release tags publish no formula (brews.skip_upload: auto).
      - if: matrix.os == 'macos-latest' && !contains(github.ref_name, '-')
        run: |
          brew install hookspot/hookspot/hookspot-cli
          scripts/smoke.sh "$VERSION" "$(brew --prefix)/bin/hookspot"
        shell: bash
