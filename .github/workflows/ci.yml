name: CI

# Every branch push and pull request runs the full build path unpublished:
# the same locked GoReleaser image and targets as release.yml, minus publishing.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # No dependency caching: the Makefile's hookspot-gomod and hookspot-gocache
    # Docker volumes are created on the runner and do not survive between runs.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: make test

      - run: make vet

      - run: make release-tools

      - run: make release-check

      - run: make release-snapshot

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: make npm-test

      - run: scripts/smoke_test.sh

      - run: npm pack --dry-run
        working-directory: npm

  # Runs the terminal tests on each platform's own pseudo-terminal (ConPTY on
  # Windows); make test covers Linux. Pull requests and main only, since the
  # macOS and Windows runners cost more.
  terminal:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test -v -run '^TestTerminal' ./cmd
        shell: bash
