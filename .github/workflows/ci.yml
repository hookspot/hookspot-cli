name: CI

# Every branch push and pull request runs the full build path unpublished:
# the same locked GoReleaser image and targets as release.yml, minus publishing.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # No dependency caching: Go's module and build caches, on the runner and in
    # the Makefile's Docker volumes, start empty on every run.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Go and golangci-lint at mise.toml's versions.
      - uses: jdx/mise-action@v5

      # QEMU runs the arm64 image's package install on the amd64 runner.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # lint (gofmt and golangci-lint), vet, test, the release snapshot and
      # image, and the npm and smoke tests.
      - run: make check

  # Runs the terminal tests on each platform's own pseudo-terminal (ConPTY on
  # Windows) and the platform-specific config permission tests; make test
  # covers Linux. Pull requests and main only, since the
  # macOS and Windows runners cost more.
  terminal:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test -v -run '^TestTerminal' ./cmd
        shell: bash

      - run: go test ./internal/config
        shell: bash
