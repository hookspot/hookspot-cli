# Live-reload config for hookspot development inside Docker.
# Driven by the `dev` service in docker-compose.yml (see `make dev`).
root = "."
tmp_dir = "tmp"

[build]
  # SERVER_URL comes from the dev container's environment. Rebuild the binary
  # on every change, baking in the server URL the same way the Dockerfile does.
  cmd = "go build -ldflags \"-X hookspot/cmd.serverURL=$SERVER_URL\" -o ./tmp/hookspot ."
  entrypoint = "./tmp/hookspot"
  # The command to (re)run is passed by `make dev` (default: `listen`).
  # Override it with ARGS, for example: make dev ARGS="listen --help".
  include_ext = ["go", "mod"]
  exclude_dir = ["tmp", ".git", "docs"]
  stop_on_error = true
  delay = 500
  # Poll for changes: Docker Desktop bind mounts on macOS/Windows don't reliably
  # forward inotify events into the container, so fsnotify alone misses edits.
  poll = true
  poll_interval = 500

[misc]
  clean_on_exit = true
