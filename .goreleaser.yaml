version: 2

project_name: hookspot

env:
  - PROD_SERVER_URL=https://app.hookspot.dev/
  - GOTOOLCHAIN=local
  - GOFLAGS=-mod=readonly

before:
  hooks:
    - go mod download
    - go test ./...
    - go run ./tools/releasecheck metadata --version={{ .Version }} --commit={{ .FullCommit }} --source-date={{ .CommitDate }} --kind={{ if .IsSnapshot }}snapshot{{ else }}release{{ end }} --server-url={{ .Env.PROD_SERVER_URL }} --output=build-info.json

builds:
  - id: hookspot
    main: .
    binary: hookspot
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - >-
        -s -w
        -X hookspot/cmd.version={{ .Version }}
        -X hookspot/cmd.serverURL={{ .Env.PROD_SERVER_URL }}
        -X hookspot/cmd.buildEnvironment=prod
        -X hookspot/cmd.commit={{ .FullCommit }}
        -X hookspot/cmd.sourceDate={{ .CommitDate }}
        -X hookspot/cmd.buildKind={{ if .IsSnapshot }}snapshot{{ else }}release{{ end }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
    mod_timestamp: '{{ .CommitTimestamp }}'
    # Hooks run without a shell. The npm package bundles these exact binaries.
    hooks:
      post:
        - sh -c 'mkdir -p npm/binaries/{{ .Os }}-{{ .Arch }} && cp "{{ .Path }}" npm/binaries/{{ .Os }}-{{ .Arch }}/hookspot{{ .Ext }}'

archives:
  - id: cli
    ids:
      - hookspot
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: 'hookspot_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    builds_info:
      mode: 0755
    files:
      - README.md
      - src: docs/releases/INSTALL.md
        strip_parent: true
      - src: docs/releases/THIRD_PARTY_NOTICES.txt
        strip_parent: true
      - build-info.json

checksum:
  name_template: 'hookspot_{{ .Version }}_checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '0.0.0-snapshot.{{ .ShortCommit }}'

changelog:
  disable: true

release:
  github:
    owner: hookspot
    name: hookspot-cli
  prerelease: auto
  replace_existing_artifacts: true
  mode: keep-existing

# A formula rather than a cask: casks quarantine the unsigned binary and do not
# work on Linux. GoReleaser reports the section as deprecated (`check` exits 2).
brews:
  - name: hookspot
    ids:
      - cli
    repository:
      owner: hookspot
      name: homebrew-hookspot
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    directory: Formula
    homepage: https://hookspot.dev
    description: Receive and forward Hookspot webhooks to a local server
    skip_upload: auto # no formula for pre-release tags
    install: bin.install "hookspot"
    test: system "#{bin}/hookspot", "version", "--json"
